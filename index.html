<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telva - Yapay Zeka Kahve Falı | Kaira Labs</title>
    <style>
        body {
            background: linear-gradient(135deg, #0A0514 0%, #1E103C 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            border: 1px solid rgba(255, 193, 7, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #FFC107;
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
        }
        p {
            font-size: 1.1rem;
            color: #d1d1d1;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        .play-button {
            display: inline-block;
            background-color: #FFC107;
            color: #0A0514;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }
        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 193, 7, 0.5);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ TELVA</h1>
        <p>Yapay Zeka ile Yeni Nesil<br>Kahve Falı Deneyimi</p>
        <a href="https://play.google.com/store/apps/details?id=com.kairalabs.telva" target="_blank" class="play-button">
            Google Play'den İndir
        </a>
        <div class="footer">
            &copy; 2026 Kaira Labs. Tüm hakları saklıdır.
        </div>
    </div>
</body>
</html>
